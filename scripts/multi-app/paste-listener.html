<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pesto Multi-App Paste Listener</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 24px; }
    table { border-collapse: collapse; margin-bottom: 16px; }
    td, th { border: 1px solid #999; padding: 6px 12px; }
    #paste-target { border: 1px solid #666; min-height: 80px; padding: 8px; margin-bottom: 12px; }
    #plain-target { width: 100%; height: 64px; }
  </style>
</head>
<body>
  <h1>Pesto Paste Listener</h1>
  <table id="rich-table">
    <thead><tr><th>Item</th><th>Value</th></tr></thead>
    <tbody><tr><td>Alpha</td><td>42</td></tr><tr><td>Beta</td><td>99</td></tr></tbody>
  </table>
  <div id="paste-target" contenteditable="true" aria-label="Rich paste target"></div>
  <textarea id="plain-target" aria-label="Plain paste target"></textarea>
  <pre id="paste-log"></pre>
  <script>
    const logEl = document.getElementById('paste-log');
    function record(e) {
      const types = Array.from(e.clipboardData ? e.clipboardData.types : []);
      logEl.textContent += JSON.stringify({
        ts: Date.now(),
        types,
        text: e.clipboardData ? e.clipboardData.getData('text/plain') : ''
      }) + '\n';
    }
    document.getElementById('paste-target').addEventListener('paste', record);
    document.getElementById('plain-target').addEventListener('paste', record);
  </script>
</body>
</html>
