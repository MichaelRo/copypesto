name: Feature request
description: Suggest an improvement or new capability for Pesto.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Pesto better. Concise, specific requests are easiest to act on.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow or pain point that prompted this request.
      placeholder: "Every time I need to paste a password I paste the wrong clip because I can't tell which card is which."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been requested before.
          required: true
