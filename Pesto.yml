name: Pesto

options:
  bundleIdPrefix: net.copypesto
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release
  # Release, but it may be driven by the UI-test harness: the scroll benchmarks (scripts/profile-scroll.sh) need an
  # optimised app in -UITestMode, and the shipped Release app must not honour that flag.
  Profile: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: "YES"
    CLANG_ENABLE_MODULES: "YES"
    PESTO_ALLOWS_TEST_HOOKS: "NO"
    PESTO_DEV_BUILD: "NO"
  configs:
    # Warnings fail Debug/CI builds only: a new SDK diagnostic must not block a Release archive.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_HARDENED_RUNTIME: "NO"
      GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
      SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
      PESTO_ALLOWS_TEST_HOOKS: "YES"
      PESTO_DEV_BUILD: "YES"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
    Profile:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      PESTO_ALLOWS_TEST_HOOKS: "YES"
      PESTO_DEV_BUILD: "YES"

packages:
  PestoCore:
    path: .
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    # 1.19.7, pinned by commit because a tag can move
    revision: 1488390b0735e726564b948bf08b384398bdab5c
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.10.1, pinned by commit because a tag can move (this is the code that installs updates)
    revision: ab7d71291238df6e0492143b120c9b696a35f603

targets:
  Pesto:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Features
        excludes: ["**/CLAUDE.md"]
      - path: Sources/Shared
      - path: THIRD-PARTY-NOTICES.md
      # Sparkle's licence must travel with the app
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/Localizable.xcstrings
      - path: Sources/Resources/InfoPlist.xcstrings
      - path: Sources/Resources/AppShortcuts.xcstrings
      - path: Sources/Resources/Pesto.sdef
      - path: Sources/Resources/Pesto.icon
    dependencies:
      - package: PestoCore
        product: PestoCore
      - package: PestoCore
        product: PestoCoreNetworking
      - package: Sparkle
        product: Sparkle
      - target: PestoControls
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto
        PRODUCT_NAME: Pesto
        MARKETING_VERSION: "1.8.0"
        CURRENT_PROJECT_VERSION: "10"
        INFOPLIST_FILE: Sources/Resources/Info.plist
        PESTO_ENTITLEMENTS: Sources/Resources/Pesto.entitlements
        PESTO_PROFILE: ""
        CODE_SIGN_ENTITLEMENTS: $(PESTO_ENTITLEMENTS)
        PROVISIONING_PROFILE_SPECIFIER: $(PESTO_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: Pesto
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        LSUIElement: "YES"

  # The Mac's WidgetKit extension: the Control Center button (macOS 26), and the Recent Clips widget, which only a
  # release signed with both provisioning profiles compiles in (PESTO_MAC_WIDGET) and entitles (ADR 0059). Every
  # other build is sandboxed with nothing else, carries no widget and stays at macOS 26 (PESTO_CONTROLS_MIN_MACOS).
  # PestoCore is linked in every build: a package dependency cannot depend on a build setting, and Sources/Widget
  # needs it to compile.
  PestoControls:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Controls
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/Widget
      - path: Sources/Resources/Localizable.xcstrings
    dependencies:
      - package: PestoCore
        product: PestoCoreExtension
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto.controls
        PRODUCT_NAME: PestoControls
        MARKETING_VERSION: "1.8.0"
        CURRENT_PROJECT_VERSION: "10"
        PESTO_CONTROLS_MIN_MACOS: "26.0"
        MACOSX_DEPLOYMENT_TARGET: $(PESTO_CONTROLS_MIN_MACOS)
        INFOPLIST_FILE: Sources/Controls/Info.plist
        PESTO_CONTROLS_ENTITLEMENTS: Sources/Controls/PestoControls.entitlements
        PESTO_CONTROLS_PROFILE: ""
        PESTO_WIDGET_CONDITION: ""
        CODE_SIGN_ENTITLEMENTS: $(PESTO_CONTROLS_ENTITLEMENTS)
        PROVISIONING_PROFILE_SPECIFIER: $(PESTO_CONTROLS_PROFILE)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(PESTO_WIDGET_CONDITION)
        SWIFT_STRICT_CONCURRENCY: complete

  # The iPhone and iPad app (ADR 0046): one target, both device families, the Mac app's bundle identifier so the sync
  # key in iCloud Keychain reaches it. Its module is PestoMobile; the product is named Pesto.
  PestoMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Mobile
      - path: Sources/MobileShared
      - path: Sources/Shared
      - path: Sources/Resources/Localizable.xcstrings
      - path: Sources/Resources/InfoPlist.xcstrings
      - path: Sources/Resources/AppShortcuts.xcstrings
      - path: Sources/Resources/Pesto.icon
      - path: Sources/Resources/PestoParmesan.icon
      - path: Sources/Resources/PestoPineNut.icon
      - path: Sources/Resources/PestoMortar.icon
    dependencies:
      - package: PestoCore
        product: PestoCore
      - package: PestoCore
        product: PestoCoreNetworking
      - target: PestoShare
        embed: true
      - target: PestoAutoFill
        embed: true
      - target: PestoKeyboard
        embed: true
      - target: PestoWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto
        PRODUCT_NAME: Pesto
        PRODUCT_MODULE_NAME: PestoMobile
        # The app group it shares with its extensions (ADR 0047), and three Keychain groups: its own first, so every
        # item it writes stays there, then the quick-insert group it shares with PestoAutoFill and PestoKeyboard
        # alone (ADRs 0051, 0061), then the widget group it shares with PestoWidget alone (ADR 0052).
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/PestoMobile.entitlements
        MARKETING_VERSION: "1.8.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        # PestoAllowsTestHooks (as the Mac's Info.plist has it), the team prefix of its Keychain groups, the clip-id
        # type and the background sync refresh (BGTaskSchedulerPermittedIdentifiers, UIBackgroundModes fetch);
        # everything else is generated.
        INFOPLIST_FILE: Sources/Resources/PestoMobile-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pesto
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Pesto saves a picture from your history to Photos when you choose Save to Photos."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Pesto asks for Face ID before it shows your clips when the History Lock is on, and before it shows a hidden clip."
        ASSETCATALOG_COMPILER_APPICON_NAME: Pesto
        # The theme icons a person can pick in Settings → Appearance (design/source/theme-icons.py).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "PestoParmesan PestoPineNut PestoMortar"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  # The iOS share extension (ADR 0047): it seals what is shared to the app's public key and writes it to the app
  # group's inbox. It never opens the store and never reads the history key.
  PestoShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MobileShare
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/Resources/Localizable.xcstrings
    dependencies:
      - package: PestoCore
        product: PestoCoreExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto.share
        PRODUCT_NAME: PestoShare
        MARKETING_VERSION: "1.8.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: "NO"
        INFOPLIST_FILE: Sources/MobileShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MobileShare/PestoShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  # The iOS AutoFill extension (ADR 0051): text insertion only. It opens the sealed quick-insert set the app keeps in
  # the app group with the key of a Keychain group only the app and it hold; never the store or the history key.
  PestoAutoFill:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MobileAutoFill
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/MobileShared
      - path: Sources/MobileShare/BrandAccent.swift
      - path: Sources/Shared/Extensions/AdaptiveMaterial.swift
      - path: Sources/Shared/Extensions/Color+Hex.swift
      - path: Sources/Shared/Extensions/PestoAccentEnvironment.swift
      - path: Sources/Shared/Extensions/ScaledFont.swift
      - path: Sources/Resources/Localizable.xcstrings
    dependencies:
      - package: PestoCore
        product: PestoCoreExtension
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto.autofill
        PRODUCT_NAME: PestoAutoFill
        MARKETING_VERSION: "1.8.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: "NO"
        INFOPLIST_FILE: Sources/MobileAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MobileAutoFill/PestoAutoFill.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  # The optional iOS keyboard (ADR 0061). With Full Access it opens the same sealed quick-insert set as PestoAutoFill,
  # with the key of the same Keychain group; never the store, the history key, the general pasteboard or the network.
  PestoKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MobileKeyboard
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/MobileShared
      - path: Sources/Shared/Extensions/AdaptiveMaterial.swift
      - path: Sources/Shared/Extensions/Color+Hex.swift
      - path: Sources/Shared/Extensions/PestoAccentEnvironment.swift
      - path: Sources/Shared/Extensions/ScaledFont.swift
      - path: Sources/MobileShare/BrandAccent.swift
      - path: Sources/Resources/Localizable.xcstrings
    dependencies:
      - package: PestoCore
        product: PestoCoreExtension
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto.keyboard
        PRODUCT_NAME: PestoKeyboard
        MARKETING_VERSION: "1.8.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: "NO"
        INFOPLIST_FILE: Sources/MobileKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MobileKeyboard/PestoKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  # The iOS Recent Clips widget (ADR 0052). It opens the sealed snapshot the app keeps in the app group with the key
  # of a Keychain group only the app and it hold; never the store or the history key.
  PestoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MobileWidget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/Mobile/AddClipboardToPestoIntent.swift
      - path: Sources/Mobile/ClipboardShortcutHandling.swift
      - path: Sources/Widget
      - path: Sources/Resources/Localizable.xcstrings
    dependencies:
      - package: PestoCore
        product: PestoCoreExtension
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto.widget
        PRODUCT_NAME: PestoWidget
        MARKETING_VERSION: "1.8.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: "NO"
        INFOPLIST_FILE: Sources/MobileWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MobileWidget/PestoWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  PestoMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/PestoMobileTests
      # The sync and crypto suites of Core, compiled again here so the wire format is proven on iOS too.
      - path: Tests/PestoCoreTests/Sync
      - path: Tests/PestoCoreTests/Support
        excludes: ["FakePasteboard.swift", "PasteboardDumpFixture.swift"]
      # The widget's views and reader, compiled again so a test can open a snapshot and draw each family.
      - path: Sources/MobileWidget
        excludes: ["Info.plist", "*.entitlements", "PestoWidgetBundle.swift", "MobileControls.swift"]
      - path: Sources/Widget
      # The keyboard's views, compiled again so a test can draw each state.
      - path: Sources/MobileKeyboard
        excludes: ["Info.plist", "*.entitlements", "*.xcprivacy"]
      - path: Sources/MobileShared
      - path: Sources/Shared/Extensions/AdaptiveMaterial.swift
      - path: Sources/Shared/Extensions/Color+Hex.swift
      - path: Sources/Shared/Extensions/PestoAccentEnvironment.swift
      - path: Sources/Shared/Extensions/ScaledFont.swift
      - path: Sources/MobileShare/BrandAccent.swift
    dependencies:
      - target: PestoMobile
      - package: PestoCore
        product: PestoCore
      - package: PestoCore
        product: PestoCoreNetworking
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pesto.app/Pesto
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

  PestoMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/PestoMobileUITests
      # The identifiers the app and its UI tests share.
      - path: Sources/Mobile/MobileAccessibilityID.swift
    dependencies:
      - target: PestoMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

  PestoCLI:
    type: tool
    platform: macOS
    sources: Sources/CLI
    settings:
      PRODUCT_NAME: pesto
      PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto.cli
    dependencies:
      - package: PestoCore
        product: PestoCore

  PestoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PestoTests
    dependencies:
      - target: Pesto
      - package: PestoCore
        product: PestoCore
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pesto.app/Contents/MacOS/Pesto
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

  PestoSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PestoSnapshotTests
    dependencies:
      - target: Pesto
      - package: PestoCore
        product: PestoCore
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pesto.app/Contents/MacOS/Pesto
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

  PestoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/PestoUITests
      # Pure-Foundation contract shared with the app: identifiers, commands and the ready-marker handshake.
      - path: Sources/Shared/Components/AccessibilityID.swift
      - path: Sources/Core/Runtime/UITestCommand.swift
      - path: Sources/Core/Runtime/UITestSupport.swift
      - path: Sources/Core/Backup/PrivacyNetworkFacts.swift
    dependencies:
      - target: Pesto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

schemes:
  Pesto:
    build:
      targets:
        Pesto: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PestoTests
        - PestoSnapshotTests
        - PestoUITests
      gatherCoverageData: true
      # Dates in the snapshot baselines are drawn in the process's own region and time zone, so a Mac set to another one
      # failed 12 of 14 popover baselines. The tests run as a US Mac in UTC.
      environmentVariables:
        - variable: TZ
          value: UTC
      commandLineArguments:
        "-AppleLocale en_US": true
        "-AppleLanguages (en)": true
    profile:
      config: Profile
    analyze:
      config: Debug
    archive:
      config: Release

  PestoSnapshotTests:
    build:
      targets:
        Pesto: all
        PestoSnapshotTests: [test]
    test:
      config: Debug
      targets:
        - PestoSnapshotTests
      environmentVariables:
        - variable: TZ
          value: UTC
      commandLineArguments:
        "-AppleLocale en_US": true
        "-AppleLanguages (en)": true

  PestoCITests:
    build:
      targets:
        Pesto: all
        PestoTests: [test]
    test:
      config: Debug
      targets:
        - PestoTests
      gatherCoverageData: true

  PestoMobile:
    build:
      targets:
        PestoMobile: all
        PestoMobileTests: [test]
        PestoMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PestoMobileTests
        - PestoMobileUITests
      environmentVariables:
        - variable: TZ
          value: UTC
      commandLineArguments:
        "-AppleLocale en_US": true
        "-AppleLanguages (en)": true
    archive:
      config: Release

  PestoMobileCITests:
    build:
      targets:
        PestoMobile: all
        PestoMobileTests: [test]
    test:
      config: Debug
      targets:
        - PestoMobileTests
      environmentVariables:
        - variable: TZ
          value: UTC
      commandLineArguments:
        "-AppleLocale en_US": true
        "-AppleLanguages (en)": true
