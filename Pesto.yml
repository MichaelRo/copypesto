name: Pesto

options:
  bundleIdPrefix: net.copypesto
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release
  # Release, but it may be driven by the UI-test harness: the scroll benchmarks (scripts/profile-scroll.sh) need an
  # optimised app in -UITestMode, and the shipped Release app must not honour that flag.
  Profile: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: "YES"
    CLANG_ENABLE_MODULES: "YES"
    PESTO_ALLOWS_TEST_HOOKS: "NO"
    PESTO_DEV_BUILD: "NO"
  configs:
    # Warnings fail Debug/CI builds only: a new SDK diagnostic must not block a Release archive.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_HARDENED_RUNTIME: "NO"
      GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
      SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
      PESTO_ALLOWS_TEST_HOOKS: "YES"
      PESTO_DEV_BUILD: "YES"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
    Profile:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      PESTO_ALLOWS_TEST_HOOKS: "YES"
      PESTO_DEV_BUILD: "YES"

packages:
  PestoCore:
    path: .
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    # 1.19.7, pinned by commit because a tag can move
    revision: 1488390b0735e726564b948bf08b384398bdab5c
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.10.1, pinned by commit because a tag can move (this is the code that installs updates)
    revision: ab7d71291238df6e0492143b120c9b696a35f603

targets:
  Pesto:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Features
        excludes: ["**/CLAUDE.md"]
      - path: Sources/Shared
      - path: THIRD-PARTY-NOTICES.md
      # Sparkle's licence must travel with the app
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/Localizable.xcstrings
      - path: Sources/Resources/Pesto.sdef
      - path: Sources/Resources/Pesto.icon
    dependencies:
      - package: PestoCore
        product: PestoCore
      - package: Sparkle
        product: Sparkle
      - target: PestoControls
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto
        PRODUCT_NAME: Pesto
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_FILE: Sources/Resources/Info.plist
        PESTO_ENTITLEMENTS: Sources/Resources/Pesto.entitlements
        PESTO_PROFILE: ""
        CODE_SIGN_ENTITLEMENTS: $(PESTO_ENTITLEMENTS)
        PROVISIONING_PROFILE_SPECIFIER: $(PESTO_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: Pesto
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        LSUIElement: "YES"

  PestoControls:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Controls
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto.controls
        PRODUCT_NAME: PestoControls
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: Sources/Controls/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Controls/PestoControls.entitlements
        SWIFT_STRICT_CONCURRENCY: complete

  PestoCLI:
    type: tool
    platform: macOS
    sources: Sources/CLI
    settings:
      PRODUCT_NAME: pesto
      PRODUCT_BUNDLE_IDENTIFIER: net.copypesto.pesto.cli
    dependencies:
      - package: PestoCore
        product: PestoCore

  PestoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PestoTests
    dependencies:
      - target: Pesto
      - package: PestoCore
        product: PestoCore
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pesto.app/Contents/MacOS/Pesto
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

  PestoSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PestoSnapshotTests
    dependencies:
      - target: Pesto
      - package: PestoCore
        product: PestoCore
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pesto.app/Contents/MacOS/Pesto
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

  PestoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/PestoUITests
      # Pure-Foundation contract shared with the app: identifiers, commands and the ready-marker handshake.
      - path: Sources/Shared/Components/AccessibilityID.swift
      - path: Sources/Core/Runtime/UITestCommand.swift
      - path: Sources/Core/Runtime/UITestSupport.swift
      - path: Sources/Core/Backup/PrivacyNetworkFacts.swift
    dependencies:
      - target: Pesto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

schemes:
  Pesto:
    build:
      targets:
        Pesto: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PestoTests
        - PestoSnapshotTests
        - PestoUITests
      gatherCoverageData: true
      # Dates in the snapshot baselines are drawn in the process's own region and time zone, so a Mac set to another one
      # failed 12 of 14 popover baselines. The tests run as a US Mac in UTC.
      environmentVariables:
        - variable: TZ
          value: UTC
      commandLineArguments:
        "-AppleLocale en_US": true
        "-AppleLanguages (en)": true
    profile:
      config: Profile
    analyze:
      config: Debug
    archive:
      config: Release

  PestoSnapshotTests:
    build:
      targets:
        Pesto: all
        PestoSnapshotTests: [test]
    test:
      config: Debug
      targets:
        - PestoSnapshotTests

  PestoCITests:
    build:
      targets:
        Pesto: all
        PestoTests: [test]
    test:
      config: Debug
      targets:
        - PestoTests
      gatherCoverageData: true
